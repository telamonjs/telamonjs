# Secrets come from the environment (the shell, or a .env next to this file):
# NEXTAUTH_SECRET and DB_PASSWORD are required; DB_PASSWORD goes into
# DATABASE_URL, so keep it URL-safe (openssl rand -hex 24). On the first start
# (empty database) SEED_ADMIN_PASSWORD is required too: the app stops without it.
version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: example-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POSTGRES_DB: example
    # Loopback only: the app reaches the database over the compose network
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: example
    restart: unless-stopped
    # The image's server listens on 3001 (Dockerfile PORT)
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@db:5432/example
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET (openssl rand -base64 32)}
      NEXTAUTH_URL: http://localhost:3001
      NEXT_PUBLIC_APP_NAME: Example
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      # First admin's password, read only by the seed on an empty database
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./public:/app/public

volumes:
  db_data:
