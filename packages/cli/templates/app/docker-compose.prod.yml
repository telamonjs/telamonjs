# Secrets come from the environment (the shell, or a .env next to this file):
# NEXTAUTH_SECRET and DB_PASSWORD are required; DB_PASSWORD goes into
# DATABASE_URL, so keep it URL-safe (openssl rand -hex 24). On the first start
# (empty database) SEED_ADMIN_PASSWORD is required too: the app stops without it.
version: '3.8'

services:
  db:
    image: {{dbImage}}
    container_name: {{projectName}}-db
    restart: unless-stopped
    environment:
{{prodDbEnvironment}}
    # Loopback only: the app reaches the database over the compose network
    ports:
      - '127.0.0.1:{{dbPort}}:{{dbPort}}'
    volumes:
      - db_data:/var/lib/{{dbVolumePath}}/data
    healthcheck:
      test: {{dbHealthCheck}}
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: {{projectName}}
    restart: unless-stopped
    ports:
      - '{{appPort}}:{{appPort}}'
    environment:
      DATABASE_URL: {{dockerDatabaseUrl}}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET (openssl rand -base64 32)}
      NEXTAUTH_URL: http://localhost:{{appPort}}
      NEXT_PUBLIC_APP_NAME: {{appName}}
      NEXT_PUBLIC_APP_URL: http://localhost:{{appPort}}
      # First admin's password, read only by the seed on an empty database
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./public:/app/public

volumes:
  db_data:
