name: Release

# Publishes the packages whose versions are not on npm yet, only after CI
# passed on main. npm trusts this workflow through trusted publishing (OIDC):
# no npm token is stored anywhere, and every release carries provenance.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    # head_sha == github.sha: the CI run was on the commit main points to now
    # (github.sha is the default branch tip for workflow_run), not on another
    # ref whose name happens to be main. If main moved since, the newer push's
    # CI triggers its own release, which publishes everything still missing.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_sha == github.sha
    runs-on: ubuntu-latest
    # Deployment branch policy: main only (a workflow_run job runs on the
    # default branch). npm's trusted publisher for each package requires it.
    environment: release
    timeout-minutes: 35 # build + publish + up to 15 min waiting for tarballs
    permissions:
      contents: write # push the release tags
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/release/publish.mjs
