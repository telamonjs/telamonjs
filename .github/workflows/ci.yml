name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # build first: workspace deps (@telamonjs/logger) resolve types from dist/
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm docs:check
      - run: pnpm docs:generate --check
      # the example must equal what the CLI generates from its template
      - run: pnpm example:generate --check
      # the site's live previews import the packages' dist/, so after build
      - run: pnpm docs:build
      - run: pnpm --filter @telamonjs/ui test:coverage --run
      - run: pnpm --filter @telamonjs/ui build-storybook

  # A pull request that changes what ships to npm must carry a changeset, or the
  # change would land on main and never be released. Skipped for Dependabot and
  # for PRs labelled `skip-changeset`.
  changeset:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-changeset')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require a changeset when published files change
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE"...HEAD)
          shipped=$(echo "$changed" | grep -E '^packages/[^/]+/(src/|package\.json$|README\.md$)' | grep -vE '\.(test|spec)\.[jt]sx?$|/__tests__/|/test/' || true)
          # a pending changeset, or one already applied by `pnpm version-packages` (CHANGELOG bumped)
          changesets=$(echo "$changed" | grep -E '^\.changeset/.+\.md$|^packages/[^/]+/CHANGELOG\.md$' | grep -v '^\.changeset/README\.md$' || true)
          if [ -n "$shipped" ] && [ -z "$changesets" ]; then
            echo "::error::These files ship to npm but the PR has no changeset. Run \`pnpm changeset\`, or add the \`skip-changeset\` label if no release is needed."
            echo "$shipped"
            exit 1
          fi
          echo "ok: ${shipped:+changeset present}${shipped:-no published files changed}"
