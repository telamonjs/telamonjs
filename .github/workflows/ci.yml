name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # build first: workspace deps (@telamonjs/logger) resolve types from dist/
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm docs:check
      - run: pnpm docs:generate --check
      # the example must equal what the CLI generates from its template
      - run: pnpm example:generate --check
      # the site's live previews import the packages' dist/, so after build
      - run: pnpm docs:build
      - run: pnpm --filter @telamonjs/ui test:coverage --run
      - run: pnpm --filter @telamonjs/ui build-storybook
